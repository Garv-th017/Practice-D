<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusTopia — Book smarter. Ride happier.</title>
    <meta name="theme-color" content="#F3F8F8" />
    <meta name="description" content="BusTopia — compare 4,500+ bus operators, pick your exact seat and track your bus live. Book in 30 seconds." />
    <script>
      try {
        var t = localStorage.getItem('bustopia-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
